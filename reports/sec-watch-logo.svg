<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111c2a"/>
      <stop offset="100%" stop-color="#0a1019"/>
    </linearGradient>

    <!-- Glowing Cyber Neon Gradient -->
    <linearGradient id="cyberNeon" x1="10" y1="10" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Radar Eye Iris Gradient -->
    <linearGradient id="irisGrad" x1="20" y1="20" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Luminous Core Pulse -->
    <radialGradient id="corePulse" cx="32" cy="31" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#A5F3FC"/>
      <stop offset="75%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#00F5A0" flood-opacity="0.38"/>
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Shield Base -->
  <path d="M 32 4.5 L 53.5 13.8 C 53.5 28.5 44 47.5 32 59.5 C 20 47.5 10.5 28.5 10.5 13.8 Z"
        fill="url(#shieldBg)"
        stroke="url(#cyberNeon)"
        stroke-width="2.6"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Angular Shield Accent Line -->
  <path d="M 32 10 L 48.5 17.5 C 48.5 29 40.8 44.5 32 54 C 23.2 44.5 15.5 29 15.5 17.5 Z"
        stroke="#1e3247"
        stroke-width="1.2"
        stroke-dasharray="4 3"
        fill="none"/>

  <!-- Radar Scanning Arc / Concentric Aperture Ring -->
  <circle cx="32" cy="31" r="16.5"
          stroke="url(#cyberNeon)"
          stroke-width="1.4"
          stroke-dasharray="14 7 4 7"
          stroke-opacity="0.65"/>

  <!-- Optical "Watch" Eye Geometry -->
  <!-- Upper & Lower Lens Contours -->
  <path d="M 17 31 C 22.5 21.5 41.5 21.5 47 31"
        stroke="url(#cyberNeon)"
        stroke-width="2.4"
        stroke-linecap="round"/>

  <path d="M 17 31 C 22.5 40.5 41.5 40.5 47 31"
        stroke="url(#cyberNeon)"
        stroke-width="2.4"
        stroke-linecap="round"/>

  <!-- Iris Circle with Neon Accent -->
  <circle cx="32" cy="31" r="8.5"
          fill="#0c1724"
          stroke="url(#irisGrad)"
          stroke-width="2"/>

  <!-- Center Focal Core (Glowing Retina) -->
  <circle cx="32" cy="31" r="4.2"
          fill="url(#corePulse)"
          filter="url(#coreGlow)"/>

  <circle cx="32" cy="31" r="2"
          fill="#FFFFFF"/>

  <!-- Active Scan Blip / Orbit Node -->
  <circle cx="44.5" cy="24" r="2.2"
          fill="#00F5A0"
          filter="url(#coreGlow)"/>

  <!-- Precision Crosshair Reticle Ticks -->
  <line x1="32" y1="18.5" x2="32" y2="20.5" stroke="#00F5A0" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="41.5" x2="32" y2="43.5" stroke="#00F5A0" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19.5" y1="31" x2="21.5" y2="31" stroke="#00F5A0" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="42.5" y1="31" x2="44.5" y2="31" stroke="#00F5A0" stroke-width="1.8" stroke-linecap="round"/>
</svg>
